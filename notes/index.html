  <style>
    :root { --bg:#07080A; --band:#0C1014; --accent:#79B8B8; --text:#E8EEF4; --muted:#8B98A8; --line:rgba(121,184,184,.16); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:Inter,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .band { position:relative; overflow:hidden; background:var(--band); border-bottom:1px solid var(--line); padding:22px 0 48px; }
    .rays {
      position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(115deg, transparent 0 14px, rgba(121,184,184,.14) 14px 15px);
      mask-image:radial-gradient(520px 280px at 86% 0%, #000 0%, transparent 72%);
    }
    .inner { width:min(760px, calc(100% - 40px)); margin:0 auto; position:relative; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:42px; }
    .brand { display:flex; align-items:center; gap:10px; letter-spacing:.22em; font-size:12px; }
    .mark { width:28px; height:28px; object-fit:contain; }
    .nav a { color:var(--muted); font-size:13px; margin-left:16px; }
    .pill { font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.08em; background:rgba(121,184,184,.16); color:var(--accent); padding:4px 8px; border-radius:4px; }
    h1 { margin-top:14px; font-weight:500; font-size:48px; letter-spacing:-.03em; }
    h1 span { color:var(--accent); }
    .list { width:min(760px, calc(100% - 40px)); margin:8px auto 72px; }
    article { border-bottom:1px solid var(--line); padding:22px 0; display:grid; gap:6px; }
    article span { font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted); }
    article strong { font-weight:500; font-size:20px; }
    article p { color:var(--muted); font-weight:300; }
  </style>
